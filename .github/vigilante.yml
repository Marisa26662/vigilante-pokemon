name: Vigilante Pokémon

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (GitHub a veces se retrasa un poco)
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviarme un email de prueba con el resumen"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar estado
        uses: actions/cache/restore@v4
        with:
          path: .estado
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Leer canales
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
          PRUEBA: ${{ github.event.inputs.prueba || 'false' }}
        run: python vigilante.py

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .estado
          key: estado-${{ github.run_id }}

      - name: Publicar panel
        run: |
          git config user.name "vigilante-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if ! git diff --staged --quiet; then
            git commit -m "Actualizar panel"
            git pull --rebase
            git push
          fi
