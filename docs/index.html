<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vigilante Pokémon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #E6EBF2; --hoja: #FFFFFF; --tinta: #18212F; --suave: #586477; --linea: #CFD7E3;
    --verde: #12793A; --verde-bg: #E2F4E8; --ambar: #9A6200; --ambar-bg: #FBF0D6;
    --gris: #7B8596; --amarillo: #FFCB05; --foco: #2F5BD3;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --texto: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #131923; --hoja: #1C2431; --tinta: #E9EEF6; --suave: #9AA6B9; --linea: #2B3546;
      --verde: #4CC97C; --verde-bg: #173324; --ambar: #F0B542; --ambar-bg: #3A2D12;
      --gris: #7D889A; --foco: #8EA9FF;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { background: var(--fondo); }
  body { margin: 0; background: var(--fondo); color: var(--tinta); font: 16px/1.5 var(--texto); }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; border-radius: 4px; }

  /* ---------- bloqueo ---------- */
  #bloqueo { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .candado { width: 100%; max-width: 360px; background: var(--hoja); border: 1px solid var(--linea);
    border-radius: 16px; padding: 28px 24px; }
  .candado h1 { font: 800 1.9rem/1.1 var(--display); margin: 0 0 6px; letter-spacing: -0.02em; }
  .candado p { margin: 0 0 20px; color: var(--suave); }
  .candado label { display: block; font-weight: 600; margin-bottom: 6px; }
  .candado input[type=password] { width: 100%; font: inherit; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--linea); background: var(--fondo); color: var(--tinta); }
  .recordar { display: flex; gap: 8px; align-items: center; margin: 14px 0 18px; color: var(--suave); font-size: .95rem; }
  .boton { width: 100%; font: 700 1rem var(--texto); padding: 12px; border: 0; border-radius: 10px;
    background: var(--amarillo); color: #18212F; cursor: pointer; }
  .boton[disabled] { opacity: .6; cursor: wait; }
  #error { color: #C23B3B; min-height: 1.5em; margin: 12px 0 0; font-size: .95rem; }
  @media (prefers-color-scheme: dark) { #error { color: #FF8A8A; } }

  /* ---------- panel ---------- */
  #panel { display: none; max-width: 820px; margin: 0 auto; padding: 32px 20px 56px; }
  .cabecera { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .titular { font: 800 clamp(2rem, 6vw, 3.2rem)/1.04 var(--display); letter-spacing: -0.03em; margin: 0; max-width: 18ch; }
  .meta { color: var(--suave); margin: 10px 0 0; max-width: 60ch; }
  .salir { font: 600 .9rem var(--texto); background: none; border: 1px solid var(--linea); color: var(--suave);
    padding: 8px 12px; border-radius: 8px; cursor: pointer; }
  .canales { display: flex; gap: 10px; flex-wrap: wrap; margin: 22px 0 0; padding: 0; list-style: none; }
  .canales li { background: var(--hoja); border: 1px solid var(--linea); border-radius: 999px; padding: 6px 14px; font-size: .92rem; }
  .canales .mal { border-color: #C23B3B; }
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin: 30px 0 18px; }
  .filtro { font: 600 .95rem var(--texto); padding: 8px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--linea); background: transparent; color: var(--tinta); }
  .filtro[aria-pressed=true] { background: var(--tinta); color: var(--fondo); border-color: var(--tinta); }
  .avisos { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .aviso { background: var(--hoja); border: 1px solid var(--linea); border-radius: 12px; padding: 14px 16px 16px; }
  .aviso.prio { border: 2px solid var(--amarillo); }
  .cabeza { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: .9rem; color: var(--suave); }
  .etiqueta { font-weight: 700; color: var(--tinta); background: var(--fondo); border-radius: 999px; padding: 2px 10px; }
  .prio .etiqueta.p { background: var(--amarillo); color: #18212F; }
  .cabeza a { color: var(--suave); }
  .texto { margin: 10px 0 0; white-space: pre-line; overflow-wrap: anywhere; }
  .previa { margin: 8px 0 0; color: var(--suave); font-size: .92rem; border-left: 3px solid var(--linea); padding-left: 10px; }
  .enlaces { margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .enlaces a { font-weight: 600; font-size: .9rem; text-decoration: none; border: 1px solid var(--linea); border-radius: 8px;
    padding: 6px 10px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vacio { color: var(--suave); padding: 20px 0; }
</style>
</head>
<body>

<main id="bloqueo">
  <form class="candado" id="formulario" autocomplete="on">
    <h1>Vigilante Pokémon</h1>
    <p>Este panel es privado. Escribe la contraseña para ver los avisos.</p>
    <input type="text" name="username" value="vigilante" autocomplete="username" hidden>
    <label for="clave">Contraseña</label>
    <input id="clave" type="password" autocomplete="current-password" required>
    <label class="recordar"><input type="checkbox" id="recordar"> Recordar en este dispositivo</label>
    <button class="boton" id="entrar" type="submit">Abrir panel</button>
    <p id="error" role="alert"></p>
  </form>
</main>

<div id="panel">
  <div class="cabecera">
    <div>
      <h1 class="titular" id="titular"></h1>
      <p class="meta" id="meta"></p>
    </div>
    <button class="salir" id="salir" type="button">Cerrar sesión</button>
  </div>
  <ul class="canales" id="canales"></ul>
  <div class="filtros" role="group" aria-label="Filtrar por producto" id="filtros"></div>
  <ul class="avisos" id="avisos"></ul>
</div>

const ITERACIONES = 600000;
const LLAVE_LOCAL = "vigilante-pokemon-clave";
let datos = null, filtro = "Todos";

async function descifrar(b64, clave) {
  const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  const llave = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: raw.slice(0, 16), iterations: ITERACIONES, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(16, 28) }, llave, raw.slice(28));
  return JSON.parse(new TextDecoder().decode(claro));
}
function guardarClave(c) { try { localStorage.setItem(LLAVE_LOCAL, c); } catch (e) {} }
function leerClave() { try { return localStorage.getItem(LLAVE_LOCAL); } catch (e) { return null; } }
function borrarClave() { try { localStorage.removeItem(LLAVE_LOCAL); } catch (e) {} }

async function abrir(clave, recordar) {
  const boton = document.getElementById("entrar"), error = document.getElementById("error");
  boton.disabled = true; boton.textContent = "Abriendo…"; error.textContent = "";
  try {
    datos = await descifrar(DATOS, clave);
    if (recordar) guardarClave(clave);
    document.getElementById("bloqueo").style.display = "none";
    document.getElementById("panel").style.display = "block";
    pintar();
  } catch (e) {
    borrarClave();
    error.textContent = "Contraseña incorrecta. Usa la misma que guardaste en el secreto PANEL_PASSWORD.";
  } finally {
    boton.disabled = false; boton.textContent = "Abrir panel";
  }
}

function el(tag, clase, texto) {
  const n = document.createElement(tag);
  if (clase) n.className = clase;
  if (texto != null) n.textContent = texto;
  return n;
}
function cuando(iso, largo) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("es-ES", largo
    ? { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }
    : { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function hace(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 60) return `hace ${Math.max(min, 1)} min`;
  const h = Math.round(min / 60);
  if (h < 48) return `hace ${h} h`;
  return `hace ${Math.round(h / 24)} días`;
}
function dominio(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return url; } }

function pintar() {
  const avisos = datos.avisos;
  const titular = document.getElementById("titular");
  titular.textContent = avisos.length ? `Último aviso ${hace(avisos[0].fecha)}` : "Todavía no hay avisos";
  document.getElementById("meta").textContent =
    `Vigilando ${Object.keys(datos.canales).length} canales para: ${datos.productos.join(", ")}. ` +
    `Panel actualizado el ${cuando(datos.actualizado, true)}.`;

  document.getElementById("canales").replaceChildren(...Object.entries(datos.canales).map(([c, st]) =>
    el("li", st === "ok" ? "" : "mal", `@${c}: ${st === "ok" ? "leyendo bien" : "no se puede leer"}`)));

  const filtros = document.getElementById("filtros");
  filtros.replaceChildren(...["Todos", ...datos.productos].map(n => {
    const cuenta = n === "Todos" ? avisos.length : avisos.filter(a => a.productos.includes(n)).length;
    const b = el("button", "filtro", `${n} (${cuenta})`);
    b.type = "button";
    b.setAttribute("aria-pressed", String(n === filtro));
    b.onclick = () => { filtro = n; pintar(); };
    return b;
  }));

  const lista = document.getElementById("avisos");
  const visibles = avisos.filter(a => filtro === "Todos" || a.productos.includes(filtro));
  if (!visibles.length) {
    lista.replaceChildren(el("li", "vacio", filtro === "Todos"
      ? "Aún no ha salido ningún mensaje sobre tus productos. En cuanto aparezca uno, lo verás aquí y te llegará por email."
      : `No hay avisos de ${filtro} todavía. Pulsa «Todos» para ver el resto.`));
    return;
  }
  lista.replaceChildren(...visibles.map(a => {
    const prio = a.productos.some(p => (datos.prioridad || []).includes(p));
    const li = el("li", prio ? "aviso prio" : "aviso");
    const cab = el("div", "cabeza");
    a.productos.forEach(p => cab.append(el("span", (datos.prioridad || []).includes(p) ? "etiqueta p" : "etiqueta", p)));
    const origen = el("a", null, `@${a.canal}`);
    origen.href = a.url; origen.target = "_blank"; origen.rel = "noopener";
    cab.append(origen, el("span", null, cuando(a.fecha)));
    li.append(cab);
    if (a.texto) li.append(el("p", "texto", a.texto.length > 600 ? a.texto.slice(0, 600) + "…" : a.texto));
    if (a.previa) li.append(el("p", "previa", a.previa));
    if (a.enlaces && a.enlaces.length) {
      const en = el("div", "enlaces");
      a.enlaces.forEach(u => { const x = el("a", null, `Abrir ${dominio(u)}`); x.href = u; x.target = "_blank"; x.rel = "noopener"; en.append(x); });
      li.append(en);
    }
    return li;
  }));
}

document.getElementById("formulario").addEventListener("submit", e => {
  e.preventDefault();
  abrir(document.getElementById("clave").value, document.getElementById("recordar").checked);
});
document.getElementById("salir").onclick = () => {
  borrarClave(); datos = null;
  document.getElementById("panel").style.display = "none";
  document.getElementById("bloqueo").style.display = "grid";
  document.getElementById("clave").value = "";
};
const guardada = leerClave();
if (guardada) { document.getElementById("recordar").checked = true; abrir(guardada, true); }
</script>
